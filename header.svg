<svg width="900" height="280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;family=Orbitron:wght@700;900&amp;display=swap');

      .bg { fill: #020010; }
      .grid-line { stroke: #0a2a4a; stroke-width: 0.5; opacity: 0.6; }

      /* Pulse rings */
      .ring1 { fill: none; stroke: #00ffe7; stroke-width: 1; opacity: 0;
        animation: pulse 3s ease-out infinite; }
      .ring2 { fill: none; stroke: #00ffe7; stroke-width: 0.7; opacity: 0;
        animation: pulse 3s ease-out 1s infinite; }
      .ring3 { fill: none; stroke: #ff6e00; stroke-width: 0.5; opacity: 0;
        animation: pulse 3s ease-out 2s infinite; }
      @keyframes pulse {
        0%   { r: 0;  opacity: 0.8; }
        100% { r: 140; opacity: 0; }
      }

      /* Neural nodes */
      .node { fill: #00ffe7; animation: blink 2s ease-in-out infinite alternate; }
      .node-dim { fill: #003a4a; }
      .node2 { fill: #ff6e00; animation: blink2 1.8s ease-in-out infinite alternate; }
      @keyframes blink  { 0%{opacity:0.3} 100%{opacity:1} }
      @keyframes blink2 { 0%{opacity:0.2} 100%{opacity:0.9} }

      /* Neural edges */
      .edge { stroke: #00ffe730; stroke-width: 0.8;
        stroke-dasharray: 200; stroke-dashoffset: 200;
        animation: drawEdge 2s ease forwards; }
      .edge2 { stroke: #ff6e0030; stroke-width: 0.6;
        stroke-dasharray: 200; stroke-dashoffset: 200;
        animation: drawEdge 2.5s ease 0.5s forwards; }
      @keyframes drawEdge { to { stroke-dashoffset: 0; } }

      /* Data stream */
      .stream { fill: #00ffe7; width: 3px; height: 3px; opacity: 0;
        animation: flow 2s linear infinite; }
      @keyframes flow {
        0%   { opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 1; }
        100% { opacity: 0; }
      }

      /* Main title */
      .title {
        font-family: 'Orbitron', 'JetBrains Mono', monospace;
        font-size: 52px; font-weight: 900;
        fill: url(#titleGrad);
        filter: url(#glow);
        opacity: 0;
        animation: fadeSlideIn 1s ease 0.3s forwards;
      }
      .subtitle {
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px; font-weight: 400;
        fill: #7fffed; letter-spacing: 4px;
        opacity: 0;
        animation: fadeSlideIn 1s ease 0.8s forwards;
      }
      .tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px; fill: #00ffe790; letter-spacing: 2px;
        opacity: 0;
        animation: fadeIn 1s ease 1.4s forwards;
      }
      .bracket { fill: #ff6e00; font-size: 52px; font-weight: 900;
        font-family: 'Orbitron', monospace; filter: url(#glowOrange); }
      @keyframes fadeSlideIn {
        0%   { opacity: 0; transform: translateY(12px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn { to { opacity: 1; } }

      /* Scanline sweep */
      .scan {
        fill: none; stroke: #00ffe708; stroke-width: 2;
        animation: scan 4s linear infinite;
      }
      @keyframes scan {
        0%   { transform: translateY(-280px); }
        100% { transform: translateY(280px); }
      }

      /* Corner deco */
      .corner { stroke: #00ffe7; stroke-width: 1.5; fill: none; opacity: 0.5; }

      /* Status bar */
      .status-bar { font-family: 'JetBrains Mono', monospace;
        font-size: 9px; fill: #00ffe760; letter-spacing: 1px; }
      .cursor { fill: #00ffe7; animation: blink-cursor 1s step-end infinite; }
      @keyframes blink-cursor { 0%,100%{opacity:1} 50%{opacity:0} }

      /* Particle dots */
      .particle { fill: #00ffe7;
        animation: particleFloat 6s ease-in-out infinite; }
      .particle:nth-child(odd)  { animation-duration: 4s; animation-delay: -2s; }
      .particle:nth-child(even) { animation-duration: 5s; animation-delay: -1s; }
      @keyframes particleFloat {
        0%,100% { transform: translateY(0px) scale(1); opacity: 0.3; }
        50%      { transform: translateY(-8px) scale(1.5); opacity: 0.9; }
      }
    </style>

    <!-- Gradient definitions -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00ffe7"/>
      <stop offset="50%"  stop-color="#7fffed"/>
      <stop offset="100%" stop-color="#00c8ff"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#020010"/>
      <stop offset="50%"  stop-color="#0a001a"/>
      <stop offset="100%" stop-color="#000d1a"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00ffe7"/>
      <stop offset="100%" stop-color="#0044ff"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bgGrad)" rx="0"/>

  <!-- Grid -->
  <g class="grid">
    <line x1="0" y1="40"  x2="900" y2="40"  class="grid-line"/>
    <line x1="0" y1="80"  x2="900" y2="80"  class="grid-line"/>
    <line x1="0" y1="120" x2="900" y2="120" class="grid-line"/>
    <line x1="0" y1="160" x2="900" y2="160" class="grid-line"/>
    <line x1="0" y1="200" x2="900" y2="200" class="grid-line"/>
    <line x1="0" y1="240" x2="900" y2="240" class="grid-line"/>
    <line x1="100" y1="0" x2="100" y2="280" class="grid-line"/>
    <line x1="200" y1="0" x2="200" y2="280" class="grid-line"/>
    <line x1="300" y1="0" x2="300" y2="280" class="grid-line"/>
    <line x1="600" y1="0" x2="600" y2="280" class="grid-line"/>
    <line x1="700" y1="0" x2="700" y2="280" class="grid-line"/>
    <line x1="800" y1="0" x2="800" y2="280" class="grid-line"/>
  </g>

  <!-- Scanline -->
  <line x1="0" y1="0" x2="900" y2="0" class="scan"/>

  <!-- LEFT neural network -->
  <!-- Layer 1 nodes -->
  <circle cx="55" cy="80"  r="4" class="node"    style="animation-delay:0s"/>
  <circle cx="55" cy="140" r="4" class="node"    style="animation-delay:0.3s"/>
  <circle cx="55" cy="200" r="4" class="node"    style="animation-delay:0.6s"/>
  <!-- Layer 2 nodes -->
  <circle cx="120" cy="60"  r="3.5" class="node2" style="animation-delay:0.1s"/>
  <circle cx="120" cy="110" r="3.5" class="node2" style="animation-delay:0.4s"/>
  <circle cx="120" cy="160" r="3.5" class="node2" style="animation-delay:0.7s"/>
  <circle cx="120" cy="210" r="3.5" class="node2" style="animation-delay:1s"/>
  <!-- Layer 3 nodes -->
  <circle cx="185" cy="90"  r="3" class="node"   style="animation-delay:0.2s"/>
  <circle cx="185" cy="140" r="3" class="node"   style="animation-delay:0.5s"/>
  <circle cx="185" cy="190" r="3" class="node"   style="animation-delay:0.8s"/>
  <!-- Edges L1→L2 -->
  <line x1="55" y1="80"  x2="120" y2="60"  class="edge"/>
  <line x1="55" y1="80"  x2="120" y2="110" class="edge"/>
  <line x1="55" y1="140" x2="120" y2="110" class="edge"/>
  <line x1="55" y1="140" x2="120" y2="160" class="edge"/>
  <line x1="55" y1="200" x2="120" y2="160" class="edge"/>
  <line x1="55" y1="200" x2="120" y2="210" class="edge"/>
  <!-- Edges L2→L3 -->
  <line x1="120" y1="60"  x2="185" y2="90"  class="edge2"/>
  <line x1="120" y1="110" x2="185" y2="90"  class="edge2"/>
  <line x1="120" y1="110" x2="185" y2="140" class="edge2"/>
  <line x1="120" y1="160" x2="185" y2="140" class="edge2"/>
  <line x1="120" y1="160" x2="185" y2="190" class="edge2"/>
  <line x1="120" y1="210" x2="185" y2="190" class="edge2"/>

  <!-- RIGHT neural network -->
  <circle cx="845" cy="80"  r="4" class="node"  style="animation-delay:0.15s"/>
  <circle cx="845" cy="140" r="4" class="node"  style="animation-delay:0.45s"/>
  <circle cx="845" cy="200" r="4" class="node"  style="animation-delay:0.75s"/>
  <circle cx="780" cy="60"  r="3.5" class="node2" style="animation-delay:0.2s"/>
  <circle cx="780" cy="110" r="3.5" class="node2" style="animation-delay:0.5s"/>
  <circle cx="780" cy="160" r="3.5" class="node2" style="animation-delay:0.8s"/>
  <circle cx="780" cy="210" r="3.5" class="node2" style="animation-delay:1.1s"/>
  <circle cx="715" cy="90"  r="3" class="node"  style="animation-delay:0.25s"/>
  <circle cx="715" cy="140" r="3" class="node"  style="animation-delay:0.55s"/>
  <circle cx="715" cy="190" r="3" class="node"  style="animation-delay:0.85s"/>
  <line x1="845" y1="80"  x2="780" y2="60"  class="edge"/>
  <line x1="845" y1="80"  x2="780" y2="110" class="edge"/>
  <line x1="845" y1="140" x2="780" y2="110" class="edge"/>
  <line x1="845" y1="140" x2="780" y2="160" class="edge"/>
  <line x1="845" y1="200" x2="780" y2="160" class="edge"/>
  <line x1="845" y1="200" x2="780" y2="210" class="edge"/>
  <line x1="780" y1="60"  x2="715" y2="90"  class="edge2"/>
  <line x1="780" y1="110" x2="715" y2="90"  class="edge2"/>
  <line x1="780" y1="110" x2="715" y2="140" class="edge2"/>
  <line x1="780" y1="160" x2="715" y2="140" class="edge2"/>
  <line x1="780" y1="160" x2="715" y2="190" class="edge2"/>
  <line x1="780" y1="210" x2="715" y2="190" class="edge2"/>

  <!-- Pulse origin (center glow) -->
  <circle cx="450" cy="130" r="0" class="ring1"/>
  <circle cx="450" cy="130" r="0" class="ring2"/>
  <circle cx="450" cy="130" r="0" class="ring3"/>
  <circle cx="450" cy="130" r="5" fill="#00ffe7" opacity="0.15" filter="url(#softGlow)"/>

  <!-- Corner decorations -->
  <polyline points="8,30 8,8 30,8"   class="corner"/>
  <polyline points="870,8 892,8 892,30" class="corner"/>
  <polyline points="8,250 8,272 30,272"  class="corner"/>
  <polyline points="870,272 892,272 892,250" class="corner"/>

  <!-- Particle scatter -->
  <circle cx="310" cy="35"  r="1.5" class="particle" style="animation-delay:0s"/>
  <circle cx="590" cy="35"  r="1"   class="particle" style="animation-delay:1s"/>
  <circle cx="420" cy="248" r="1.5" class="particle" style="animation-delay:2s"/>
  <circle cx="480" cy="252" r="1"   class="particle" style="animation-delay:0.5s"/>
  <circle cx="350" cy="242" r="1.2" class="particle" style="animation-delay:1.5s"/>

  <!-- MAIN TEXT GROUP -->
  <g transform="translate(450,130)" text-anchor="middle">
    <!-- Status indicator -->
    <text y="-85" class="tag">◈ PROFILE · INITIALIZED ◈</text>

    <!-- Name -->
    <text y="-30" class="title">RUTVIK PRAJAPATI</text>

    <!-- Subtitle -->
    <text y="10" class="subtitle">AI ENGINEER  ·  ML ARCHITECT  ·  DATA SCIENTIST</text>

    <!-- Bottom bar -->
    <rect x="-220" y="28" width="440" height="1" fill="url(#barGrad)" opacity="0.6"/>

    <!-- Status line -->
    <text y="46" class="tag" style="animation-delay:2s">
      [ PYTHON · PYTORCH · TENSORFLOW · LANGCHAIN · TRANSFORMERS ]
    </text>

    <!-- Status bar bottom -->
    <text y="75" class="status-bar">SYS:ONLINE  ▸  STATUS:BUILDING_AI  ▸  LOC:INDIA</text>
  </g>
</svg>
