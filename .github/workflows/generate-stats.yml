name: 📊 Generate GitHub Stats Cards

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  CARD 1 — Profile Overview + Full Year Heatmap
  #  Uses only: base + isocalendar (both confirmed working)
  # ═══════════════════════════════════════════════════════════════
  metrics-overview:
    name: Profile Overview
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Rutvik5o
          filename: metrics-overview.svg
          output_action: commit
          committer_branch: dist
          committer_message: "chore: update metrics-overview"
          template: classic
          config_timezone: Asia/Kolkata
          config_padding: 6%, 10%
          config_display: large
          config_animations: yes
          base: header, activity, community, repositories
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  # ═══════════════════════════════════════════════════════════════
  #  CARD 2 — Language Stats (no indepth — confirmed working)
  # ═══════════════════════════════════════════════════════════════
  metrics-languages:
    name: Language Stats
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Rutvik5o
          filename: metrics-languages.svg
          output_action: commit
          committer_branch: dist
          committer_message: "chore: update metrics-languages"
          template: classic
          config_timezone: Asia/Kolkata
          config_padding: 6%, 10%
          config_display: large
          config_animations: yes
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 10
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_threshold: 0%
          plugin_languages_indepth: no

  # ═══════════════════════════════════════════════════════════════
  #  SNAKE ANIMATION
  # ═══════════════════════════════════════════════════════════════
  build-snake:
    name: 🐍 Snake Animation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Rutvik5o
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: output
          folder: dist
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: false
          force: true
