name: 📊 Generate GitHub Stats Cards

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────
  #  SINGLE JOB — Generate all cards + push in one shot
  # ─────────────────────────────────────────────────────────────
  generate-all:
    name: Generate All Stats Cards
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ── Card 1: Full Profile Metrics ──────────────────────────
      - name: 🧠 Full Profile Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Rutvik5o
          template: terminal
          config_timezone: Asia/Kolkata
          config_padding: 6%, 10%
          config_display: large
          config_animations: yes
          base: header, activity, community, repositories, metadata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes
          plugin_introduction: yes
          plugin_introduction_title: yes
          filename: metrics-full.svg
          output_action: none

      # ── Card 2: Language Stats ─────────────────────────────────
      - name: 📊 Language Breakdown
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Rutvik5o
          template: terminal
          config_timezone: Asia/Kolkata
          config_padding: 6%, 10%
          config_display: large
          config_animations: yes
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 20
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 10
          plugin_languages_recent_load: 500
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_threshold: 0%
          plugin_languages_indepth: yes
          filename: metrics-languages.svg
          output_action: none

      # ── Card 3: Achievements ───────────────────────────────────
      - name: 🏆 Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Rutvik5o
          template: terminal
          config_timezone: Asia/Kolkata
          config_padding: 6%, 10%
          config_animations: yes
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 0
          filename: metrics-achievements.svg
          output_action: none

      # ── Card 4: Calendar ───────────────────────────────────────
      - name: 📅 Activity Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Rutvik5o
          template: terminal
          config_timezone: Asia/Kolkata
          config_padding: 6%, 10%
          config_display: large
          config_animations: yes
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 2
          filename: metrics-calendar.svg
          output_action: none

      # ── Move all SVGs into dist/ folder ───────────────────────
      - name: 📁 Collect SVGs
        run: |
          mkdir -p dist
          mv metrics-full.svg        dist/ 2>/dev/null || true
          mv metrics-languages.svg   dist/ 2>/dev/null || true
          mv metrics-achievements.svg dist/ 2>/dev/null || true
          mv metrics-calendar.svg    dist/ 2>/dev/null || true
          ls -la dist/

      # ── Push dist/ to dist branch ─────────────────────────────
      - name: 🚀 Push to dist branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: dist
          folder: dist
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: false
          force: true

  # ─────────────────────────────────────────────────────────────
  #  SNAKE ANIMATION — separate job
  # ─────────────────────────────────────────────────────────────
  build-snake:
    name: 🐍 Generate Snake
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Rutvik5o
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake to output branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: output
          folder: dist
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: false
          force: true
