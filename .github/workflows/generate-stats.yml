name: 📊 Generate GitHub Stats Cards

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────
  #  JOB 1 — FULL METRICS  (terminal theme · full color)
  # ─────────────────────────────────────────────────────────────
  metrics-full:
    name: Full Metrics Card
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 🧠 Full Profile Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Rutvik5o

          # ── Visual ──────────────────────────────────────────
          template: terminal
          config_timezone: Asia/Kolkata
          config_padding: 6%, 10%
          config_display: large
          config_animations: yes

          # ── Base sections ───────────────────────────────────
          base: header, activity, community, repositories, metadata

          # ── Extra plugins ───────────────────────────────────

          # Contribution calendar heatmap
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Stars & repos stats
          plugin_stars: yes
          plugin_stars_limit: 4

          # Habits & coding patterns
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

          # Introduction / bio
          plugin_introduction: yes
          plugin_introduction_title: yes

          # Reactions on issues/PRs
          plugin_reactions: yes
          plugin_reactions_limit: 100
          plugin_reactions_limit_issues: 100
          plugin_reactions_details: percentage
          plugin_reactions_display: columns

          # Notable contributions
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit

          filename: dist/metrics-full.svg

  # ─────────────────────────────────────────────────────────────
  #  JOB 2 — LANGUAGES  (detailed · colored · both modes)
  # ─────────────────────────────────────────────────────────────
  metrics-languages:
    name: Language Stats
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 📊 Language Breakdown
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Rutvik5o

          template: terminal
          config_timezone: Asia/Kolkata
          config_padding: 6%, 10%
          config_display: large
          config_animations: yes
          base: ""

          plugin_languages: yes
          plugin_languages_analysis_timeout: 20
          plugin_languages_categories: markup, programming, data
          plugin_languages_colors: github
          plugin_languages_limit: 10
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_load: 500
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_threshold: 0%
          plugin_languages_indepth: yes
          plugin_languages_indepth_custom: ""
          plugin_languages_skipped: ""

          filename: dist/metrics-languages.svg

  # ─────────────────────────────────────────────────────────────
  #  JOB 3 — ACHIEVEMENTS  (all unlocked · detailed)
  # ─────────────────────────────────────────────────────────────
  metrics-achievements:
    name: Achievements Card
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 🏆 Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Rutvik5o

          template: terminal
          config_timezone: Asia/Kolkata
          config_padding: 6%, 10%
          config_animations: yes
          base: ""

          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 0
          plugin_achievements_ignored: ""

          filename: dist/metrics-achievements.svg

  # ─────────────────────────────────────────────────────────────
  #  JOB 4 — ACTIVITY CALENDAR  (skyline / heatmap)
  # ─────────────────────────────────────────────────────────────
  metrics-calendar:
    name: Activity Calendar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 📅 Activity Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Rutvik5o

          template: terminal
          config_timezone: Asia/Kolkata
          config_padding: 6%, 10%
          config_display: large
          config_animations: yes
          base: ""

          plugin_calendar: yes
          plugin_calendar_limit: 2

          filename: dist/metrics-calendar.svg

  # ─────────────────────────────────────────────────────────────
  #  JOB 5 — PUSH ALL TO dist BRANCH
  # ─────────────────────────────────────────────────────────────
  push-dist:
    name: Push All Cards
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      [
        metrics-full,
        metrics-languages,
        metrics-achievements,
        metrics-calendar,
      ]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dist
          fetch-depth: 0

      - name: Download all SVG artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Push to dist branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: dist
          folder: dist
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: false

  # ─────────────────────────────────────────────────────────────
  #  JOB 6 — SNAKE ANIMATION
  # ─────────────────────────────────────────────────────────────
  build-snake:
    name: Generate Snake
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Rutvik5o
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake to output branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: output
          folder: dist
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: false
