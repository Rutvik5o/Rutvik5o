name: 📊 Generate GitHub Stats Cards

on:
  schedule:
    - cron: "0 */8 * * *"    # every 8 hours
  workflow_dispatch:           # manual trigger
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  #  JOB 1 — Generate Stats SVG cards
  # ─────────────────────────────────────────────
  build-stats:
    name: Generate Stats Cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub Stats Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Rutvik5o
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          filename: dist/metrics.svg

      - name: Generate Language Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Rutvik5o
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          filename: dist/metrics-languages.svg

      - name: Generate Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Rutvik5o
          template: classic
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 0
          filename: dist/metrics-achievements.svg

      - name: Push all cards to dist branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: dist
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  #  JOB 2 — Generate Snake animation
  # ─────────────────────────────────────────────
  build-snake:
    name: Generate Snake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Rutvik5o
          outputs: |
            snake-dist/github-contribution-grid-snake.svg
            snake-dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: snake-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
